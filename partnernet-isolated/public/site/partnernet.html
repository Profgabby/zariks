const money=n=>'₦'+Math.round(n).toLocaleString('en-NG');const fmt=n=>Math.round(n).toLocaleString('en-NG');let role='Super Administrator',page='Executive Dashboard',state='All states',lga='All LGAs';const steps=['School order','Validated','Producer assigned','Production issued','Materials confirmed','Batch recorded','Quality released','Dispatched','Delivery confirmed','Invoice issued','Customer paid','Producer payable','Reconciled'];let orders=[{id:'DEMO-1001',school:'Demo Kano School',product:'ZARIKS Roselle Drink',qty:120,hub:'KN-01',model:'A',step:0,status:'Open',rejected:false,paid:false}];let nextOrder=1002;let audit=[];function log(action){audit.unshift({time:new Date().toLocaleString(),action});}const active=()=>orders.filter(o=>!o.rejected);function nav(){let html='';for(const [g,items] of Object.entries(groups)){html+=`<div class="navgroup">${g}</div>`;for(const p of items){if(roleAccess[role]&&!roleAccess[role].includes(p)&&g==='OPERATIONS'&&p!=='Profile Settings')continue;html+=`<button class="nav ${page===p?'active':''}" data-page="${p}">${p}<span>›</span></button>`}}document.getElementById('sidebar').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelector('aside').classList.remove('open');render()})}function header(title,sub,extra=''){return `<div class="heading"><div><div class="eyebrow">ZARIKS · ${page}</div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}function kpi(label,value,note=''){return `<div class="card"><div class="label">${label}</div><div class="kpi">${value}</div><div class="mini" style="color:#83909a;margin-top:5px">${note}</div></div>`}function table(head,rows){return `<div class="wide"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function status(t){return `<span class="tag ${t==='Demo approved'||t==='Released'||t==='Delivered'?'ok':t==='Rejected'?'bad':'warn'}">${t}</span>`}function filterHubs(){return hubs.filter(h=>(state==='All states'||h.state===state)&&(lga==='All LGAs'||h.lga===lga))}function overview(){let n=filterHubs().length, q=active().reduce((a,o)=>a+o.qty,0), delivered=active().filter(o=>o.step>=8).reduce((a,o)=>a+o.qty,0);return header('Executive operations','One connected view of the proposed producer-to-school network.',geographyControl())+`<div class="notice"><b>Demonstration environment.</b> Ten hubs are proposals, not verified facilities. KN-01 has a fictional approval solely to exercise the transaction workflow. No real production, regulatory authorization, payment or customer agreement is represented.</div><div class="grid">${kpi('Proposed hubs',n,'10 proposed across Kano and Jigawa')}${kpi('Illustrative monthly capacity',fmt(n*1000*26),'At 100% utilization')}${kpi('Demo bottles ordered',fmt(q),'From simulated school orders')}${kpi('Demo bottles delivered',fmt(delivered),'Workflow-derived')}</div><div class="two"><div class="card"><h2>Hub network</h2>${table(['Hub','State','LGA','Daily capacity','Status'],filterHubs().map(h=>[h.id,h.state,h.lga,fmt(h.capacity),status(h.status)]))}</div><div class="card"><h2>Operational priorities</h2><p>Complete the demonstration transaction from school purchase order to producer settlement.</p><button class="btn" onclick="go('Schools & Markets')">Manage school orders</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><h3>Model-specific cost ownership</h3><p><b>A:</b> Producer supplies finished bottles.</p><p><b>B:</b> ZARIKS supplies materials; producer receives a conversion fee.</p><p><b>C:</b> Contract-defined shared procurement.</p></div></div>`}function hubsPage(){return header(page,'Proposed Kano and Jigawa production network. No site is represented as a real approved factory.',geographyControl())+`<div class="grid">${kpi('Proposed hubs','10')}${kpi('Kano hubs','5')}${kpi('Jigawa hubs','5')}${kpi('Network capacity/day','10,000','Illustrative only')}</div><div class="card" style="margin-top:16px"><h2>Hub register</h2>${table(['ID','State','LGA','Producer','Capacity/day','Verification'],filterHubs().map(h=>[h.id,h.state,h.lga,h.producer,fmt(h.capacity),status(h.status)]))}</div>`}function finance(){return header('Financial scenarios','Editable planning assumptions for contract manufacturing. Figures are simulated, not actual accounts.')+`<div class="card"><div class="filters">${[['price','Selling price / bottle',500],['producer','Model A producer cost',320],['delivery','Delivery cost / bottle',50],['other','Other variable cost / bottle',40],['fixed','Monthly overhead',1200000],['util','Utilization %',60]].map(([id,l,v])=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="number" min="0" value="${v}"></div>`).join('')}</div><div style="margin-top:16px"><button class="btn" onclick="calculate()">Recalculate scenarios</button></div></div><div id="financeResults"></div><div class="notice">Model B and C require contract-specific material ownership and conversion-fee records. The default calculator models Model A only. Operating profit excludes financing, tax, capital expenditure and cash timing.</div>`}function calculate(){let v=id=>+document.getElementById(id).value;let price=v('price'),unit=v('producer')+v('delivery')+v('other'),fixed=v('fixed'),capacity=10*1000*26;let rows=[25,40,60,80,100].map(u=>{let q=capacity*u/100,rev=q*price,cost=q*unit,con=rev-cost;return [`${u}%`,fmt(q),money(rev),money(cost),money(con),money(con-fixed)]});document.getElementById('financeResults').innerHTML=`<div class="grid" style="margin-top:16px">${kpi('Monthly capacity',fmt(capacity))}${kpi('Contribution / bottle',money(price-unit))}${kpi('Break-even bottles',price>unit?fmt(Math.ceil(fixed/(price-unit))):'Not attainable')}${kpi('Selected utilization',v('util')+'%')}</div><div class="card" style="margin-top:16px"><h2>Profitability sensitivity — Model A</h2>${table(['Utilization','Bottles sold','Revenue','Variable cost','Contribution','Operating profit'],rows)}</div>`}function orderForm(){return `<div class="card"><h2>New school order · simulated</h2><div class="filters"><div class="field"><label>School</label><input id="school" value="Demo Kano School" maxlength="70"></div><div class="field"><label>Product</label><select id="product"><option>ZARIKS Roselle Drink</option><option>ZARIKS Ginger Drink</option></select></div><div class="field"><label>Bottles</label><input type="number" id="qty" value="120" min="1" max="1000"></div><div class="field"><label>Production model</label><select id="model"><option>A</option><option>B</option><option>C</option></select></div></div><p class="mini">Orders are demonstration records. Model B/C accounting is not enabled for settlement in this prototype.</p><button class="btn" onclick="addOrder()">Create demo order</button></div>`}function ordersPage(){return header('School orders and fulfillment','Track one order through production, quality release, delivery, invoicing and settlement.')+`<div class="two"><div>${orderForm()}</div><div class="card"><h2>Control rules</h2><p>Only the fictional demo-approved producer KN-01 can be assigned. Quality rejection blocks dispatch. Model B/C require material reconciliation and are not financially settled by this demo.</p><button class="btn alt" onclick="go('Production Orders')">Open workflow</button></div></div><div class="card" style="margin-top:16px"><h2>Order register</h2>${table(['Order','School','Bottles','Model','Progress','Action'],orders.map(o=>[o.id,esc(o.school),o.qty,o.model,o.rejected?status('Rejected'):steps[Math.min(o.step,steps.length-1)],`<button class="btn alt" onclick="selectOrder('${o.id}')">View</button>`]))}</div>`}let selected='DEMO-1001';function workflow(){let o=orders.find(x=>x.id===selected)||orders[0];return header('Production-to-payment workflow','Stateful demonstration with quality gates and visible transaction history.')+`<div class="card"><div class="filters"><div class="field"><label>Order</label><select id="orderPick" onchange="selected=this.value;render()">${orders.map(x=>`<option ${x.id===o.id?'selected':''} value="${x.id}">${x.id} · ${esc(x.school)}</option>`).join('')}</select></div><div class="field"><label>Contract model</label><input value="${o.model} — ${o.model==='A'?'Finished bottle purchase':o.model==='B'?'ZARIKS materials + conversion':'Hybrid sourcing'}" disabled></div><div class="field"><label>Assigned hub</label><input value="${o.step>=2?o.hub:'Not assigned'}" disabled></div></div><div class="progress">${steps.map((s,i)=>`<div class="step ${o.step>i?'done':o.step===i?'current':''}">${i+1}. ${s}</div>`).join('')}</div><h2>${o.rejected?'Batch rejected':o.step===steps.length?'Demo transaction completed':'Next: '+steps[o.step]}</h2><p>Quantity: <b>${o.qty} bottles</b> · Product: ${esc(o.product)} · School: ${esc(o.school)}</p><div class="filters"><button class="btn green" ${o.rejected||o.step>=steps.length?'disabled':''} onclick="advance()">${o.step===steps.length?'Completed':'Complete current step'}</button><button class="btn alt" ${o.step!==6?'disabled':''} onclick="reject()">Reject quality inspection</button><button class="btn alt" onclick="go('Schools & Markets')">Back to orders</button></div><div id="message" class="mini" style="margin-top:12px"></div></div><div class="two"><div class="card"><h2>Demonstration accounting</h2>${table(['Measure','Amount'],[['Customer invoice (₦500/bottle)',money(o.qty*500)],['Model A producer invoice (₦320/bottle)',o.model==='A'?money(o.qty*320):'Requires contract costs'],['Distribution (₦50/bottle)',money(o.qty*50)],['Other variable (₦40/bottle)',money(o.qty*40)],['Illustrative contribution',o.model==='A'?money(o.qty*90):'Not calculated'],['Customer payment',o.step>=11?'Demo recorded':'Not recorded'],['Producer payable',o.step>=12&&o.model==='A'?money(o.qty*320):'Not settled']])}</div><div class="card"><h2>Audit history (browser session)</h2>${audit.filter(a=>a.action.includes(o.id)).slice(0,12).map(a=>`<p class="mini">${esc(a.time)} — ${esc(a.action)}</p>`).join('')||'<p>No transitions recorded this session.</p>'}</div></div>`}function advance(){let o=orders.find(x=>x.id===selected);if(!o||o.rejected||o.step>=steps.length)return;if(o.step===2&&hubs.find(h=>h.id===o.hub).status!=='Demo approved'){alert('Blocked: producer not demo-approved.');return}if(o.step===11&&o.model!=='A'){alert('Model B/C settlement blocked: contract-specific costs and inventory ownership must be reconciled in a production backend.');return}let s=steps[o.step];o.step++;log(`${o.id}: ${s}`);render()}function reject(){let o=orders.find(x=>x.id===selected);if(o.step!==6)return;o.rejected=true;log(`${o.id}: Batch rejected by simulated QA`);render()}function addOrder(){let school=document.getElementById('school').value.trim(),qty=Number(document.getElementById('qty').value),model=document.getElementById('model').value,product=document.getElementById('product').value;if(!school||!Number.isInteger(qty)||qty<1||qty>1000){alert('Enter a school and an integer quantity from 1 to 1,000.');return}let id='DEMO-'+nextOrder++;orders.push({id,school,qty,product,model,hub:'KN-01',step:0,rejected:false});selected=id;log(id+': Order created');page='Production Orders';render()}function selectOrder(id){selected=id;page='Production Orders';render()}function go(p){page=p;render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function generic(){let descriptions={'Partners':'Producer, farmer, cooperative and logistics partner onboarding records.','Batch Management':'Batch documentation, quality holds and lot genealogy.','Materials & Inventory':'Ownership-aware procurement, material receipts, issues and reconciliation.','Quality & Compliance':'Facility verification, product authorization, inspections and batch release.','Logistics & Delivery':'Dispatch, delivery evidence, exceptions and returns.','Analytics':'Performance trends, state comparisons and sales forecasting.','Contracts':'Contract terms, model assignments and legal-review status.','Administration':'Users, roles, permissions, documents and audit logs.','Profile Settings':'Account preferences, regional location and notifications.','Our Producers':'Independent facilities manufacture products under contract.','Our Farmers':'Approved farmers and cooperatives supply ingredients.','Schools & Institutions':'Institutional sourcing, school procurement and customer support.','Sustainability':'Responsible local sourcing, waste reduction and transparent traceability.','News & Resources':'Information and resources will be published when verified.','Contact':'Business, partnership and quality inquiries.'};let title=page;return header(title,descriptions[page]||'ZARIKS distributed production and institutional market platform.')+`<div class="card"><h2>${title}</h2><p>${descriptions[page]||'Explore the network and related operating records.'}</p><div class="notice"><b>Prototype boundary:</b> This section has a meaningful navigation destination and conceptual record view, but its secure production workflow, persistent database and permissions are not implemented in this standalone demonstration.</div>${table(['Module','Record type','Status'],[['ZARIKS PartnerNet',title,'Prototype / planned'],['Database integration','PostgreSQL / Supabase','Not connected'],['User authentication','Server-side roles','Not connected']])}</div>`}function publicPage(){if(page==='Home')return `<div class="hero"><div><div class="eyebrow" style="color:#f6d58b">Connecting local production to institutional demand</div><h1>ZARIKS Beverages</h1><p>Connecting Local Producers, Farmers and Markets.</p><button class="btn" onclick="go('How It Works')">Explore our model</button> <button class="btn alt" onclick="go('Executive Dashboard')">Open PartnerNet demo</button></div></div><div class="three" style="margin-top:18px"><div class="card"><h2>Independent producers</h2><p>Contract manufacturing across approved facilities without ZARIKS owning local factories.</p></div><div class="card"><h2>Farmer sourcing</h2><p>Traceable roselle, ginger and other approved ingredient procurement.</p></div><div class="card"><h2>Institutional markets</h2><p>School and organizational purchasing with quality-controlled fulfillment.</p></div></div>`;if(page==='How It Works')return header('How the ZARIKS network works','Three contractual arrangements, one coordinated market network.')+`<div class="three">${[['Model A','Full-service contract manufacturing','Producer owns and buys ingredients and packaging; ZARIKS purchases accepted finished bottles.'],['Model B','ZARIKS-supplied materials','ZARIKS owns ingredients and packaging; producer is paid a conversion fee.'],['Model C','Hybrid farmer–producer sourcing','Contract specifies who owns each input and which costs the producer price includes.']].map(x=>`<div class="card"><span class="pill">${x[0]}</span><h2 style="margin-top:15px">${x[1]}</h2><p>${x[2]}</p></div>`).join('')}</div><div class="card" style="margin-top:16px"><h2>End-to-end chain</h2><p>Farmer → Approved supplier → Contracted producer → Quality release → Delivery → School / institutional buyer</p></div>`;if(page==='Our Beverages')return header('Our beverages','Illustrative product categories; no nutrition, shelf-life or regulatory claims are asserted.')+`<div class="three">${[['Roselle','Roselle-based beverages'],['Ginger','Ginger beverages'],['Fruit','Fruit-based and seasonal drinks']].map(x=>`<div class="card"><div style="font-size:45px">🥤</div><h2>${x[1]}</h2><p>Specifications, verified labeling and approved manufacturing facility details will appear after authorization.</p><span class="tag warn">Concept product</span></div>`).join('')}</div>`;if(page==='Become a Partner')return header('Become a ZARIKS partner','Choose a partner type to understand the onboarding process.')+`<div class="card"><div class="filters"><div class="field"><label>Partner category</label><select id="partnerType">${['Beverage producer','Farmer','Cooperative','Ingredient supplier','Packaging supplier','School','Institutional buyer','Logistics partner','Distributor'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>State / FCT</label><select id="partnerState" onchange="updateLgaSelect('partnerState','partnerLga')">${stateOptions()}</select></div><div class="field"><label>LGA / Area council</label><select id="partnerLga">${lgaOptions('')}</select></div></div><div class="notice">Registration is not submitted or stored in this prototype. A production system requires authenticated onboarding, secure document uploads and verified approvals.</div><button class="btn" onclick="alert('Registration is not live. No information was submitted.')">View registration status</button></div>`;return generic()}function render(){if(roleAccess[role]&&roleAccess[role].length&&groups.OPERATIONS.includes(page)&&!roleAccess[role].includes(page)&&page!=='Profile Settings')page='Executive Dashboard';nav();let content=page==='Profile Settings'?profilePage():page==='Executive Dashboard'?overview():['National Operations','State Performance','LGA Performance','Hub Performance'].includes(page)?hubsPage():page==='Finance & Scenarios'?finance():page==='Schools & Markets'?ordersPage():page==='Production Orders'?workflow():['Home','How It Works','Our Beverages','Become a Partner'].includes(page)?publicPage():generic();document.getElementById('main').innerHTML=content+`<div class="footer">ZARIKS PartnerNet · Standalone interactive demonstration · No authentication, persistence, payments or live regulatory approvals · Never use for real operational records</div>`;let f=document.getElementById('stateFilter');if(f)f.onchange=()=>{state=f.value;lga='All LGAs';render()};let lf=document.getElementById('lgaFilter');if(lf)lf.onchange=()=>{lga=lf.value;render()};if(page==='Finance & Scenarios')calculate()}document.getElementById('role').onchange=e=>{role=e.target.value;render()};/* ZARIKS additive application extension. Existing legacy functions and data are retained. */
const ZP_CONTENT = {"Home": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**Eyebrow:** ZARIKS BEVERAGES **H1:** Local beverages. Stronger partnerships. Better market access. **Lead:** ZARIKS brings together independent beverage producers, farmers, suppliers and institutional customers through an organized model for sourcing, production, quality oversight and delivery. Our goal is to help capable local businesses reach dependable markets while enabling buyers to order through a coordinated network."}, {"type": "cta", "text": "**Primary CTA:** Become a Partner → `/become-a-partner`"}, {"type": "cta", "text": "**Secondary CTA:** Explore How It Works → `/how-it-works`"}, {"type": "h", "text": "Section: A connected beverage ecosystem"}, {"type": "p", "text": "**Heading:** One network. Different partners. Shared opportunities. **Copy:** Producers contribute facilities, equipment and manufacturing expertise. Farmers and approved suppliers provide ingredients. Schools and other institutional buyers communicate demand. ZARIKS coordinates brand standards, contracts, orders, traceability and commercial relationships through PartnerNet. Each party retains the responsibilities specified in its agreement."}, {"type": "p", "text": "**Four service cards:**"}, {"type": "li", "text": "**For Producers:** Access structured orders, product specifications, partner onboarding and transparent settlement records. CTA: Explore Producer Partnerships → `/producers`."}, {"type": "li", "text": "**For Farmers:** Register available produce, participate in supplier qualification and connect with approved sourcing opportunities. CTA: Explore Farmer Sourcing → `/farmers`."}, {"type": "li", "text": "**For Schools:** Request information about approved beverages, institutional pricing and scheduled delivery arrangements. CTA: School Supply Enquiries → `/schools-institutions`."}, {"type": "li", "text": "**For Partners:** Discover supplier, packaging, logistics and commercial collaboration opportunities. CTA: Apply to Partner → `/become-a-partner`."}, {"type": "h", "text": "Section: Our beverage approach"}, {"type": "p", "text": "**Heading:** Products designed around safety, consistency and suitability. **Copy:** ZARIKS intends to develop a portfolio of roselle-based, ginger-based, fruit-based and other suitable beverages. Each product must have an approved formulation, appropriate packaging, verified labeling, validated storage requirements and applicable regulatory authorization before commercial distribution."}, {"type": "cta", "text": "**CTA:** View Our Beverages → `/beverages`."}, {"type": "h", "text": "Section: How the network works"}, {"type": "p", "text": "**Heading:** From sourcing to school delivery. **Steps:** 1. Buyer requests or places an order. 2. ZARIKS checks product and buyer requirements. 3. An appropriately approved producer receives an order. 4. Ingredients and packaging are sourced according to the selected contract model. 5. Production is documented and quality release is verified. 6. Delivery is confirmed and financial records are reconciled."}, {"type": "cta", "text": "**CTA:** See the Full Process → `/how-it-works`."}, {"type": "h", "text": "Section: Initial geographic focus"}, {"type": "p", "text": "**Heading:** Starting with a focused Kano–Jigawa feasibility network. **Copy:** The planning model identifies five candidate local government areas in Kano State and five in Jigawa State. These are proposed territories for commercial and regulatory feasibility assessment—not confirmed operating factories. Expansion will depend on approved facilities, viable producer contracts, school demand, logistics and food-safety controls."}, {"type": "h", "text": "Section: Call to action"}, {"type": "p", "text": "**Heading:** Interested in building the ZARIKS network? **Copy:** Tell us whether you produce beverages, grow ingredients, operate a school or manage institutional purchasing. We will use your enquiry to identify the appropriate qualification process."}, {"type": "cta", "text": "**CTA:** Start a Partnership Enquiry → `/become-a-partner`."}, {"type": "h", "text": "Home components"}, {"type": "p", "text": "Hero, four audience cards, product-category preview, six-step process, pilot-territory note, FAQ preview, CTA banner. Do not display fictitious live counters or partner logos."}], "About ZARIKS": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** About ZARIKS **Lead:** ZARIKS is being developed as a beverage brand and market coordination business that works with independent production partners and agricultural suppliers rather than requiring company-owned factories in every market."}, {"type": "h", "text": "Mission"}, {"type": "p", "text": "To create organized and commercially viable connections between beverage producers, ingredient suppliers and institutional buyers through reliable market access, clear standards, transparent transactions and accountable partnerships."}, {"type": "h", "text": "Vision"}, {"type": "p", "text": "A scalable beverage partnership network in which local production capability and agricultural supply can serve verified market demand across Nigerian communities."}, {"type": "h", "text": "What makes the model different"}, {"type": "p", "text": "**Asset-light production:** Independent partners retain ownership and operation of their facilities. **Producer-centered contracts:** Roles, prices, inputs, quality responsibilities and payment conditions are defined before production. **Farmer-linked sourcing:** Approved suppliers and traceable ingredient lots connect agricultural producers to beverage demand. **Institutional market access:** Schools and other organizations can procure through coordinated ordering and delivery arrangements. **Digital accountability:** PartnerNet links partners, orders, materials, batches, deliveries and settlements."}, {"type": "h", "text": "Business model principles"}, {"type": "p", "text": "1. Manufacture only through appropriately qualified and authorized facilities. 2. Match production to credible orders rather than speculative volume. 3. Avoid double-counting inputs supplied by ZARIKS and costs included in producer fees. 4. Use clear quality, labeling, shelf-life and traceability requirements. 5. Provide transparent settlement and complaint-handling procedures. 6. Expand state by state after measurable commercial and operational validation."}, {"type": "h", "text": "Who does what?"}, {"type": "h", "text": "Governance and company details"}, {"type": "p", "text": "Show clearly marked editable fields for registered legal entity name, CAC number, office address, contact channels, leadership profiles and regulatory records. Keep unpublished until verified."}, {"type": "cta", "text": "**CTA:** Explore the Partnership Model → `/how-it-works`."}], "Our Beverages": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Our Beverages **Lead:** Explore beverage categories planned for the ZARIKS portfolio. Commercial availability depends on approved formulations, manufacturing arrangements, labeling, packaging and regulatory requirements."}, {"type": "h", "text": "Category: Roselle and Zobo Beverages"}, {"type": "p", "text": "**Description:** Beverages developed around *Hibiscus sabdariffa* (roselle), with formulation-specific ingredient profiles and packaging. Product sweetness, acidity, storage requirements and shelf life must be validated before release. **Example product card title:** ZARIKS Roselle Beverage — Concept Product. **Status:** Product concept; not available for purchase until approved."}, {"type": "h", "text": "Category: Ginger Beverages"}, {"type": "p", "text": "**Description:** Ginger-forward beverage concepts using specified ingredient quality and standardized preparation methods. Avoid unverified therapeutic or immunity claims. **Example:** ZARIKS Ginger Beverage — Concept Product."}, {"type": "h", "text": "Category: Fruit-Based Beverages"}, {"type": "p", "text": "**Description:** Fruit beverage concepts that may use approved seasonal or locally sourced ingredients, with formulation-specific processing and storage controls. **Example:** ZARIKS Fruit Blend — Concept Product."}, {"type": "h", "text": "Category: Institutional Packs"}, {"type": "p", "text": "**Description:** Proposed pack sizes and ordering configurations suitable for authorized schools, canteens, events and institutional buyers, subject to product suitability and approved pricing."}, {"type": "h", "text": "Product detail template"}, {"type": "p", "text": "Each product page/card must support: product ID, title, category, approved image, short description, ingredients, allergens, net volume, packaging, validated nutrition information, storage instructions, shelf life, approval/document reference, manufacturing authorization status, available territories, minimum order quantity, institutional price (when approved), and enquiry action."}, {"type": "h", "text": "Filters"}, {"type": "p", "text": "Category; pack size; availability status; state; suitability/requirements. Never show products as “in stock” without an inventory source."}, {"type": "cta", "text": "**CTA:** Request Product Information → `/contact`; **Institutional Supply Enquiry** → `/schools-institutions`."}, {"type": "h", "text": "Product safety note"}, {"type": "p", "text": "“Product descriptions are informational. Do not rely on concept products as commercially available. Final labels, claims, handling instructions and sale eligibility require verification.”"}], "How It Works": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** How ZARIKS Works **Lead:** A coordinated workflow connects buyer demand to independent producers and approved ingredient suppliers, with defined controls for quality, traceability, delivery and payment."}, {"type": "h", "text": "Seven-stage workflow"}, {"type": "p", "text": "1. **Register and qualify partners.** Producers, suppliers and buyers provide relevant business details and documentation. Review status is recorded. 2. **Agree the commercial model.** Each producer contract specifies Model A, B or C, pricing, materials ownership, delivery duties and payment terms. 3. **Confirm customer demand.** A school or institution submits an enquiry or purchase order; ZARIKS validates the buyer, product and order. 4. **Allocate approved production.** Orders go only to eligible producers with appropriate capacity and current authorization. 5. **Document sourcing and production.** Materials, ingredient lots, production batches, quantities and exceptions are recorded. 6. **Release and deliver.** Required quality checks and batch release precede dispatch; customer receipt and delivery exceptions are documented. 7. **Reconcile and improve.** Invoices, payments, returns, producer settlements and performance indicators update PartnerNet."}, {"type": "h", "text": "Three contract-production models"}, {"type": "p", "text": "**Model A — Full-service:** Producer procures approved inputs and supplies finished bottles at an agreed price. **Model B — ZARIKS materials:** ZARIKS purchases specified materials; producer is paid a conversion fee. **Model C — Hybrid:** ZARIKS controls selected sourcing/packaging arrangements while producers procure agreed inputs. **Important accounting rule:** Costs of ZARIKS-owned materials must not be included again in the producer fee."}, {"type": "h", "text": "Frequently asked questions"}, {"type": "p", "text": "**Does ZARIKS own every factory?** No. The intended model uses independent qualified production partners. **Can any producer join?** Producers may apply, but participation depends on commercial, facility, product and compliance checks. **Who buys ingredients?** The signed contract determines responsibility. **Can schools order directly?** Approved buyers should be able to request quotes and, when enabled, submit orders through the buyer portal. **How are batches traced?** Ingredient lots and production records link finished batches to deliveries and customers. **Who handles delivery?** Either the producer or an approved logistics partner, depending on contract terms."}, {"type": "cta", "text": "**CTA:** Compare Partnership Options → `/become-a-partner`."}], "Our Producers": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Grow Your Beverage Business Through Structured Market Partnerships **Lead:** ZARIKS aims to work with capable independent beverage producers who want to supply agreed products to institutional customers under clear quality and commercial arrangements."}, {"type": "h", "text": "Why partner?"}, {"type": "li", "text": "Opportunities to receive confirmed production orders when available."}, {"type": "li", "text": "Defined product specifications, volumes and payment conditions."}, {"type": "li", "text": "Access to a coordinated school and institutional market development process."}, {"type": "li", "text": "Digital production records, quality workflows and settlement visibility."}, {"type": "li", "text": "Potential access to approved ingredient and packaging supply arrangements."}, {"type": "h", "text": "What producers retain"}, {"type": "p", "text": "Ownership of their premises and equipment; employment of their workforce; routine maintenance; manufacturing operations; and the responsibilities allocated to them in the signed contract."}, {"type": "h", "text": "Eligibility and qualification"}, {"type": "p", "text": "Business identification and facility information; applicable regulatory authorization; product capability; equipment and sanitation assessment; suitable water and process controls; batch documentation; traceability; ability to meet approved specifications and delivery commitments."}, {"type": "h", "text": "Application workflow"}, {"type": "p", "text": "Apply → Submit documents → Facility/product review → Commercial quotation → Agreement → Test order/qualification → Approved for eligible orders. Approval is not automatic."}, {"type": "h", "text": "Producer dashboard preview"}, {"type": "p", "text": "Upcoming orders; capacity; materials received (if applicable); production batches; quality status; dispatches; accepted quantities; invoices; settlement history; performance alerts."}, {"type": "h", "text": "Producer FAQs"}, {"type": "p", "text": "**Must I buy new machinery?** Not necessarily; existing equipment must be adequate and compliant. **Who purchases packaging?** Contract-dependent. **Are orders guaranteed?** No; only signed commitments establish quantities. **When am I paid?** According to agreed acceptance, invoicing and settlement terms. **Can I serve other brands?** Subject to lawful, negotiated confidentiality and exclusivity terms."}, {"type": "cta", "text": "**CTA:** Apply as a Producer → `/become-a-partner?type=producer`."}], "Our Farmers": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Connecting Agricultural Supply to Beverage Production **Lead:** ZARIKS plans to build a traceable sourcing network for ingredients such as dried roselle and ginger, connecting eligible farmers, cooperatives and suppliers with contracted beverage producers."}, {"type": "h", "text": "What we seek"}, {"type": "p", "text": "**Roselle:** Correctly identified, appropriately dried and handled calyces meeting agreed specifications. **Ginger:** Suitable quality, cleanliness and handling for the intended beverage process. **Other ingredients:** Product-specific inputs sourced only from qualified suppliers."}, {"type": "h", "text": "Farmer benefits"}, {"type": "p", "text": "Transparent sourcing enquiries; agreed grades and quantities; documented deliveries; traceable acceptance and rejection reasons; visibility into invoice/payment status where ZARIKS is the purchasing party."}, {"type": "h", "text": "Supplier qualification"}, {"type": "p", "text": "Supplier identification; farm/cooperative location; crop and harvest details; estimated volume; drying/storage methods; lot coding; sample inspection and testing as applicable; agreed price and delivery terms."}, {"type": "h", "text": "How sourcing works"}, {"type": "p", "text": "Registration → Qualification → Supply opportunity → Quote/contract → Harvest lot record → Delivery → Inspection → Acceptance → Payment according to contract."}, {"type": "h", "text": "Supplier ownership distinction"}, {"type": "p", "text": "Under Model A or C, a producer may buy directly from an approved farmer. Under Model B, ZARIKS may buy and own the ingredients. PartnerNet must record the actual buyer and material owner rather than assuming all farmer sales belong to ZARIKS."}, {"type": "h", "text": "Sustainability and fair dealing"}, {"type": "p", "text": "Explain reasonable grading standards, transparent disputes, supplier feedback and responsible handling of personal and farm data. Do not promise guaranteed purchases or minimum prices without contracts."}, {"type": "cta", "text": "**CTA:** Register as a Farmer or Cooperative → `/become-a-partner?type=farmer`."}], "Schools & Institutions": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Organized Beverage Supply for Schools and Institutions **Lead:** ZARIKS is developing a structured approach to beverage procurement, allowing authorized buyers to request product information, quotations, scheduled supply and accountable delivery arrangements."}, {"type": "h", "text": "Who can enquire?"}, {"type": "p", "text": "Schools; school canteens; educational institutions; approved event buyers; workplaces and other institutions. Eligibility and product suitability must be assessed for each buyer type."}, {"type": "h", "text": "Proposed buyer benefits"}, {"type": "li", "text": "Clear product specifications and approved pack sizes."}, {"type": "li", "text": "Transparent quotations and ordering terms."}, {"type": "li", "text": "Scheduled delivery and proof of receipt."}, {"type": "li", "text": "Batch-level traceability and complaint reporting."}, {"type": "li", "text": "Digital invoices and order history."}, {"type": "li", "text": "Support for repeat or standing orders when commercially agreed."}, {"type": "h", "text": "School procurement journey"}, {"type": "p", "text": "Enquiry → Buyer verification → Product suitability review → Quote → Supply agreement → Order → Approved production → Delivery → Receipt → Invoice/payment → Feedback."}, {"type": "h", "text": "Required buyer information"}, {"type": "p", "text": "Institution name; type; state/LGA; authorized procurement contact; delivery location; expected quantities; preferred delivery days; procurement requirements; payment arrangements; relevant school nutrition or canteen rules."}, {"type": "h", "text": "School-calendar awareness"}, {"type": "p", "text": "Order forecasts must distinguish term days, holidays, examination periods, weekends and special events. Do not assume schools purchase every day of the year."}, {"type": "h", "text": "Food safety and child suitability"}, {"type": "p", "text": "Only products meeting applicable regulatory, labeling, food-safety and institutional requirements should be offered. No unsupported health claims. Storage and transport conditions must follow the validated product specification."}, {"type": "cta", "text": "**Primary CTA:** Request an Institutional Quote → `/contact?topic=school-quote`"}, {"type": "cta", "text": "**Secondary CTA:** Register as a Buyer → `/become-a-partner?type=school`."}], "Become a Partner": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Become a ZARIKS Partner **Lead:** Tell us how you would like to participate. Each application follows a role-specific review process; submission does not guarantee approval, orders or funding."}, {"type": "h", "text": "Partner type selector"}, {"type": "p", "text": "Producer; Farmer; Cooperative; Ingredient Supplier; Packaging Supplier; School/Institution; Logistics Partner; Distributor/Commercial Partner."}, {"type": "h", "text": "Common form fields"}, {"type": "p", "text": "Partner type (required); legal/business name; contact person; phone; email; state; LGA; locality; brief description; consent to privacy notice; optional supporting documents. Provide clear required-field validation."}, {"type": "h", "text": "Role-specific conditional fields"}, {"type": "p", "text": "**Producer:** facility address, products, daily capacity, equipment overview, regulatory documentation status, preferred Model A/B/C. **Farmer/cooperative:** crops, estimated seasonal quantities, harvest calendar, postharvest method, farm/cooperative location. **School:** institution type, authorized buyer, estimated volume, preferred delivery schedule. **Supplier:** material categories, quality specifications, typical lead times, minimum order quantities. **Logistics:** service territories, vehicle/storage capabilities, relevant permits and insurance."}, {"type": "h", "text": "Application statuses"}, {"type": "p", "text": "Draft → Submitted → Under Review → More Information Requested → Qualified → Approved / Declined / Suspended. Changes must be logged."}, {"type": "h", "text": "Submission confirmation"}, {"type": "p", "text": "“Your application has been received for review” only after successful persistence. Include a reference ID and next-step guidance. If standalone demo has no backend, say “Demo submission recorded locally; no application has been sent to ZARIKS.”"}, {"type": "h", "text": "Privacy"}, {"type": "p", "text": "Collect only necessary personal data; restrict uploaded identity and business documents; implement consent, retention and access controls appropriate to Nigerian data protection requirements."}], "Sustainability": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Responsible Growth Across the Beverage Value Chain **Lead:** ZARIKS aims to build a business model that supports local economic participation while strengthening sourcing transparency, food safety, resource efficiency and responsible partnerships."}, {"type": "h", "text": "Pillar 1: Local enterprise"}, {"type": "p", "text": "Work with qualified independent producers and seek transparent contracts that define obligations and compensation. Avoid unverified job-creation claims."}, {"type": "h", "text": "Pillar 2: Farmer participation"}, {"type": "p", "text": "Develop approved farmer/cooperative sourcing channels, traceable lot records and clear grading/acceptance criteria. Avoid claiming guaranteed farmer income."}, {"type": "h", "text": "Pillar 3: Packaging and waste"}, {"type": "p", "text": "Evaluate packaging material use, breakage, returns and recycling opportunities where feasible. Do not describe packaging as recyclable without verifying local collection and processing realities."}, {"type": "h", "text": "Pillar 4: Water and energy"}, {"type": "p", "text": "Encourage appropriate water quality, sanitation, energy-use awareness and process efficiency among producers. Food safety takes precedence over cost-saving measures."}, {"type": "h", "text": "Pillar 5: Product integrity"}, {"type": "p", "text": "Require suitable specifications, batch documentation, complaint handling and recall capability."}, {"type": "h", "text": "Proposed sustainability indicators"}, {"type": "p", "text": "Approved local suppliers; farmer lots traceable; rejected/wasted packaging units; liters of process water per accepted bottle (where measured); energy per batch (where measured); percentage of batches with complete records; supplier payment timeliness."}, {"type": "h", "text": "Reporting principle"}, {"type": "p", "text": "Display actual measurements only when captured, with date, source, unit and scope. Show “No verified data available” instead of invented impact metrics."}, {"type": "cta", "text": "**CTA:** Explore Farmer Partnerships → `/farmers`."}], "News & Resources": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** News & Resources **Lead:** Find company announcements, partnership guidance, product updates and practical resources for producers, farmers and institutional buyers."}, {"type": "h", "text": "Content categories"}, {"type": "li", "text": "**Company Updates:** Verified launches, geographic changes and organizational announcements."}, {"type": "li", "text": "**Producer Resources:** Qualification requirements, batch documentation guidance and contract-model explainers."}, {"type": "li", "text": "**Farmer Resources:** Ingredient handling, sourcing registration and lot-traceability guides."}, {"type": "li", "text": "**School Procurement:** Ordering instructions, product documentation and delivery processes."}, {"type": "li", "text": "**Quality and Safety:** Approved notices, safe-handling guidance, complaints and recall information."}, {"type": "li", "text": "**PartnerNet Guides:** Role-based help articles and platform release notes."}, {"type": "h", "text": "Resource card schema"}, {"type": "p", "text": "Title; summary; category; publication date; author/owner; review status; document link; last updated date. Search, category filters and pagination required."}, {"type": "h", "text": "Initial evergreen resource titles (drafts, not news claims)"}, {"type": "p", "text": "1. Understanding the Three ZARIKS Contract-Production Models. 2. How to Apply as an Independent Beverage Producer. 3. Farmer and Cooperative Sourcing Registration Guide. 4. School Procurement Enquiry Checklist. 5. Understanding Production Batch Traceability. 6. How PartnerNet Records Materials and Producer Payments."}, {"type": "p", "text": "**Editorial controls:** Draft → Reviewed → Approved → Published → Archived. Do not fabricate press coverage, dates, testimonials or completed partnerships."}], "Contact": [{"type": "h", "text": "Hero"}, {"type": "p", "text": "**H1:** Contact ZARIKS **Lead:** Contact our team about producer partnerships, farmer sourcing, institutional supply, logistics, product information or an existing order."}, {"type": "h", "text": "Enquiry categories"}, {"type": "p", "text": "General enquiry; Producer partnership; Farmer/cooperative sourcing; School/institutional quote; Supplier partnership; Logistics partnership; Product complaint; Product safety concern; PartnerNet support."}, {"type": "h", "text": "Contact form"}, {"type": "p", "text": "Name; organization (optional); email; phone; state; LGA (conditional); enquiry type; subject; message; order/batch reference (conditional); attachment (if appropriate); consent checkbox."}, {"type": "h", "text": "Contact information"}, {"type": "p", "text": "Display editable placeholders: `[Verified business email pending]`, `[Verified telephone pending]`, `[Verified office address pending]`. Do not invent contact information. Hide placeholder fields on public production until verified or use the functional form."}, {"type": "h", "text": "Safety complaints"}, {"type": "p", "text": "Give product-safety concerns a distinct priority path. Capture product name, batch/lot, purchase date, location, issue description and contact method. Show instructions not to consume a product suspected of being unsafe and to retain packaging/lot details for investigation; do not give unsupported medical guidance."}, {"type": "h", "text": "Confirmation and service standards"}, {"type": "p", "text": "Only show a submitted reference when stored successfully. Do not promise a response time without an approved service-level commitment."}]};

function zpPublic(){const blocks=ZP_CONTENT[page]||[];const hero=blocks.find(b=>b.text.startsWith('**H1:**'));let output=header(page,hero?ZP_PLAIN(hero.text.replace('**H1:**','')):'Connecting local producers, farmers and markets.');output+='<div class="zp-content-grid"><article class="card zp-article">';let list=false;for(const b of blocks){if(b.type!=='li'&&list){output+='</ul>';list=false}if(b.type==='h'){output+=`<h2>${esc(ZP_PLAIN(b.text))}</h2>`}else if(b.type==='li'){if(!list){output+='<ul>';list=true}output+=`<li>${esc(ZP_PLAIN(b.text))}</li>`}else if(b.type==='p'){if(b.text.startsWith('**H1:**'))continue;output+=`<p>${esc(ZP_PLAIN(b.text))}</p>`}else if(b.type==='cta'){output+=`<p class="zp-emphasis">${esc(ZP_PLAIN(b.text))}</p>`}}if(list)output+='</ul>';output+='</article><aside class="card zp-side"><h2>Connect with ZARIKS</h2><p>Explore the proposed partner network. Product and facility authorizations require verification before commercial activity.</p>'+zpCtas()+'<div class="notice">Illustrative content. No verified commercial operations or approvals are implied.</div></aside></div>';
if(page==='Become a Partner')output+=zpForm('partner');if(page==='Contact')output+=zpForm('contact');if(page==='News & Resources')output+=zpResourceSearch();if(page==='Our Beverages')output+=zpProducts();return output}
function zpForm(kind){let partner=kind==='partner',types=partner?['Producer','Farmer','Cooperative','Ingredient Supplier','Packaging Supplier','School/Institution','Logistics Partner','Distributor']:['General enquiry','Producer partnership','Farmer sourcing','School quote','Supplier partnership','Product complaint','Product safety concern','PartnerNet support'];return `<div class="card zp-form"><h2>${partner?'Partner application':'Contact and enquiries'} · demonstration</h2><p>Information entered here is not transmitted to ZARIKS. Avoid entering sensitive personal data.</p><form onsubmit="zpSubmit(event,'${kind}')"><div class="zp-form-grid"><label>Category<select name="category" required>${types.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Organization / name<input name="organization" required minlength="2" maxlength="100" placeholder="Demo organization"></label><label>Contact email<input type="email" name="email" required placeholder="example@example.invalid"></label><label>State / FCT<select name="state" required onchange="zpFormLga(this)"><option value="">Select state</option>${STATES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>LGA / Area Council<select name="lga" required><option value="">Choose state first</option></select></label><label>${partner?'Business capability':'Enquiry subject'}<input name="subject" required minlength="5" maxlength="120"></label></div><label>Details<textarea name="details" required minlength="15" maxlength="1000" rows="4" placeholder="Explain your demonstration enquiry"></textarea></label><label class="zp-check"><input type="checkbox" required> I understand this is a local demonstration, not a live submission.</label><button class="btn" type="submit">Save demo ${partner?'application':'enquiry'}</button><p class="zp-result" role="status" aria-live="polite"></p></form></div>`}
function zpFormLga(el){let select=el.form.elements.lga;select.innerHTML='<option value="">Select LGA</option>'+((LGA_DATA[el.value]||[]).map(x=>`<option>${esc(x)}</option>`).join(''));}
let zpSubmissionCount=0;function zpSubmit(event,kind){event.preventDefault();const form=event.target;if(!form.reportValidity())return;zpSubmissionCount++;form.querySelector('.zp-result').textContent=`Demo ${kind} recorded in this browser session as DEMO-${String(zpSubmissionCount).padStart(4,'0')}. Nothing was sent or submitted for review.`;form.reset()}
function zpResourceSearch(){return `<div class="card"><h2>Resource finder</h2><label>Search guidance<input id="zpResourceQuery" type="search" oninput="zpFilterResources()" placeholder="Search titles"></label><div id="zpResourceList">${zpResourceList('')}</div></div>`}
const zpResources=['Understanding the Three ZARIKS Contract-Production Models','How to Apply as an Independent Beverage Producer','Farmer and Cooperative Sourcing Registration Guide','School Procurement Enquiry Checklist','Understanding Production Batch Traceability','How PartnerNet Records Materials and Producer Payments'];
function zpResourceList(q){let matches=zpResources.filter(x=>x.toLowerCase().includes(q.toLowerCase()));return matches.length?matches.map(x=>`<p>📄 ${esc(x)} <span class="tag">Draft guidance</span></p>`).join(''):'<p>No matching resource titles.</p>'}

function zpFinanceCalc(a){let capacity=a.hubs*a.daily*a.days,manufactured=Math.floor(capacity*a.util/100),accepted=Math.floor(manufactured*a.accept/100),sold=Math.floor(Math.min(accepted,a.demand)*a.sell/100);let mfg=a.model==='A'?a.producer:a.model==='B'?a.materials+a.conversion+a.handling:a.hybrid+a.materials+a.handling;let delivery=a.includedDelivery?0:a.delivery;let revenue=sold*a.price;let variable=manufactured*mfg+sold*(delivery+a.other);let contribution=revenue-variable;let profit=contribution-a.fixed;let unitMargin=a.price-mfg-delivery-a.other;let breakeven=unitMargin>0?Math.ceil(a.fixed/unitMargin):null;return {capacity,manufactured,accepted,sold,mfg,revenue,variable,contribution,profit,breakeven,producerPayment:manufactured*(a.model==='B'?a.conversion:a.model==='C'?a.hybrid:a.producer),materialCost:manufactured*(a.model==='A'?0:a.materials),deliveryCost:sold*delivery}}
let zpFinancialState={model:'A',hubs:10,daily:1000,days:26,util:60,accept:100,sell:100,demand:260000,price:500,producer:320,materials:165,conversion:155,hybrid:220,handling:0,delivery:50,other:40,fixed:1200000,includedDelivery:false};
function zpFinancialPage(){let f=zpFinancialState;let inputs=[['hubs','Hubs',1],['daily','Bottles per hub/day',1],['days','Production days/month',1],['util','Utilization (%)',1],['accept','Batch acceptance (%)',1],['sell','Sell-through (%)',1],['demand','Demand ceiling (bottles)',1],['price','Net selling price (₦)',1],['producer','Model A all-inclusive producer fee (₦)',1],['materials','ZARIKS-owned materials per bottle (₦)',1],['conversion','Model B conversion fee (₦)',1],['hybrid','Model C producer fee excluding ZARIKS inputs (₦)',1],['handling','Attributable manufacturing handling (₦)',1],['delivery','Separate delivery cost (₦)',1],['other','Other variable cost per sold bottle (₦)',1],['fixed','Fixed overhead per month (₦)',1]];return header('Financial management','Contract-aware scenarios · simulated NGN figures · not financial statements')+`<div class="card"><div class="zp-form-grid"><label>Contract model<select id="zpf-model" onchange="zpUpdateFinance()">${['A','B','C'].map(x=>`<option ${x===f.model?'selected':''}>${x}</option>`).join('')}</select></label>${inputs.map(([id,label])=>`<label>${label}<input id="zpf-${id}" type="number" min="0" step="1" value="${f[id]}" oninput="zpUpdateFinance()"></label>`).join('')}<label class="zp-check"><input id="zpf-includedDelivery" type="checkbox" ${f.includedDelivery?'checked':''} onchange="zpUpdateFinance()"> Producer fee already includes delivery</label></div></div><div id="zpFinanceResults"></div>`}
function zpUpdateFinance(){let f=zpFinancialState;f.model=document.getElementById('zpf-model').value;for(const k of Object.keys(f)){if(k==='model'||k==='includedDelivery')continue;let n=Number(document.getElementById('zpf-'+k).value);f[k]=Number.isFinite(n)?Math.max(0,n):0}f.includedDelivery=document.getElementById('zpf-includedDelivery').checked;for(const k of ['util','accept','sell'])f[k]=Math.min(100,f[k]);let x=zpFinanceCalc(f);let rows=[25,40,60,80,100].map(u=>{let r=zpFinanceCalc({...f,util:u});return [u+'%',r.sold.toLocaleString(),ZP_CURRENCY(r.revenue),ZP_CURRENCY(r.variable),ZP_CURRENCY(r.profit)]});let byHub=hubs.map(h=>{let r=zpFinanceCalc({...f,hubs:1,daily:h.capacity,fixed:f.fixed/Math.max(1,hubs.length),demand:f.demand/Math.max(1,hubs.length)});return [h.id,h.state,h.lga,ZP_CURRENCY(r.revenue),ZP_CURRENCY(r.profit)]});document.getElementById('zpFinanceResults').innerHTML=`<div class="grid zp-gap">${kpi('Planned monthly capacity',x.capacity.toLocaleString())}${kpi('Manufactured / accepted',x.manufactured.toLocaleString()+' / '+x.accepted.toLocaleString())}${kpi('Sold (scenario)',x.sold.toLocaleString())}${kpi('Operating result',ZP_CURRENCY(x.profit))}</div><div class="grid zp-gap">${kpi('Revenue',ZP_CURRENCY(x.revenue))}${kpi('Producer payments',ZP_CURRENCY(x.producerPayment))}${kpi('ZARIKS material cost',ZP_CURRENCY(x.materialCost))}${kpi('Break-even volume',x.breakeven===null?'Not attainable':x.breakeven.toLocaleString())}</div><div class="card zp-gap"><h2>Cost reconciliation</h2>${table(['Metric','Simulated amount'],[['Manufacturing cost / unit',ZP_CURRENCY(x.mfg)],['Variable expenses',ZP_CURRENCY(x.variable)],['Distribution expense',ZP_CURRENCY(x.deliveryCost)],['Contribution',ZP_CURRENCY(x.contribution)],['Fixed overhead',ZP_CURRENCY(f.fixed)],['Operating profit / loss',ZP_CURRENCY(x.profit)]])}<p class="mini">Manufacturing costs are incurred on manufactured units; distribution and other variable allowances on sold units. Inventory carrying, waste recovery, taxes, finance charges and cash timing are excluded. Model C fee must exclude the separately supplied materials.</p></div><div class="card zp-gap"><h2>Utilization sensitivity</h2>${table(['Utilization','Bottles sold','Revenue','Variable expenses','Operating result'],rows)}<button class="btn alt" onclick="zpCsv('finance')">Export finance CSV</button></div><div class="card zp-gap"><h2>Illustrative hub allocation</h2><p>Equal overhead allocation for comparison; per-hub demand is a scenario assumption.</p>${table(['Hub','State','LGA','Revenue','Allocated result'],byHub)}<button class="btn alt" onclick="zpCsv('hubs')">Export hub CSV</button></div>`}
function zpCsv(type){let lines=type==='finance'?[['metric','value','status'],...Object.entries(zpFinanceCalc(zpFinancialState)).map(([k,v])=>[k,v,'SIMULATED'])]:[['hub','state','lga','planned_daily_capacity','status'],...hubs.map(h=>[h.id,h.state,h.lga,h.capacity,'PROPOSED / DEMO'])];let csv=lines.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='zariks-'+type+'-simulated.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function zpModulePage(){if(page==='User Profiles & Settings')return profilePage();if(page==='Financial Management')return zpFinancialPage();if(page==='Sales & Orders')return ordersPage();if(page==='Reports & Analytics')return header(page,'Exportable simulation and record views')+`<div class="card"><h2>Data exports</h2><button class="btn" onclick="zpCsv('hubs')">Export hub register CSV</button> <button class="btn alt" onclick="zpCsv('finance')">Export scenario CSV</button><p>CSV exports contain simulated data only.</p></div>`;let title=page,cols=ZP_LABELS[title]||['Reference','Location','Type','Status'],rows=ZP_RECORDS[title]||[];return header(title,ZP_MORE[title])+`<div class="notice">Demonstration module: local session records only. No real facility approval, contract, dispatch, payment or regulatory authorization is performed.</div><div class="card"><div class="filters"><label class="field">Search records<input id="zpSearch" type="search" oninput="zpSearchRows()" placeholder="Search demo records"></label><button class="btn alt" onclick="zpExportModule()">Export CSV</button></div><div id="zpTable">${table(cols,rows.map(r=>r.map(esc)))}</div></div><div class="card zp-gap"><h2>Add illustrative record</h2><form onsubmit="zpAddRecord(event)"><div class="zp-form-grid">${cols.map((c,i)=>`<label>${esc(c)}<input name="col${i}" required maxlength="100" placeholder="Demo value"></label>`).join('')}</div><button class="btn" type="submit">Add demo record</button><p role="status" id="zpRecordFeedback"></p></form></div>`}
function zpSearchRows(){let q=document.getElementById('zpSearch').value.toLowerCase(),rows=(ZP_RECORDS[page]||[]).filter(r=>r.some(x=>String(x).toLowerCase().includes(q)));document.getElementById('zpTable').innerHTML=table(ZP_LABELS[page]||[],rows.map(r=>r.map(esc)))}
function zpAddRecord(e){e.preventDefault();let form=e.target,cols=ZP_LABELS[page]||[];let row=cols.map((_,i)=>form.elements['col'+i].value.trim());if(row.some(x=>!x))return;ZP_RECORDS[page]??=[];ZP_RECORDS[page].push(row);form.reset();zpSearchRows();document.getElementById('zpRecordFeedback').textContent='Illustrative record added to this session. Not saved to a production database.'}
function zpExportModule(){let rows=[ZP_LABELS[page],...(ZP_RECORDS[page]||[])];let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='zariks-'+page.toLowerCase().replace(/\W+/g,'-')+'-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function zpHubEdit(){return `<div class="card zp-gap"><h2>Editable proposed hub capacity</h2><p>Capacity changes affect the hub register and scenario tables; all locations remain proposed.</p><form onsubmit="zpSaveHub(event)"><div class="zp-form-grid"><label>Hub<select name="hub">${hubs.map(h=>`<option>${h.id}</option>`).join('')}</select></label><label>Daily planned capacity<input name="capacity" type="number" min="0" max="100000" required value="1000"></label></div><button class="btn" type="submit">Update planned capacity</button><p id="zpHubFeedback" role="status"></p></form></div>`}
function zpSaveHub(e){e.preventDefault();let id=e.target.elements.hub.value,capacity=Number(e.target.elements.capacity.value);if(!Number.isInteger(capacity)||capacity<0||capacity>100000)return;hubs.find(h=>h.id===id).capacity=capacity;render();document.getElementById('zpHubFeedback').textContent='Updated proposed capacity for '+id+' in this browser session.'}
// Replace only the renderer and navigation functions, retaining the original records and workflow.
const zpOriginalRender=render;
render=function(){if(page==='Finance & Scenarios')page='Financial Management';if(page==='Profile Settings')page='User Profiles & Settings';if(ZP_MODULES.includes(page)){nav();document.getElementById('main').innerHTML=zpModulePage()+`<div class="footer">Standalone demonstration · simulated data · no secure authentication or live backend</div>`;if(page==='Financial Management')zpUpdateFinance();return}if(ZP_CONTENT[page]){nav();document.getElementById('main').innerHTML=zpPublic()+`<div class="footer">ZARIKS · Connecting local producers, farmers and markets · © ${new Date().getFullYear()} · Demonstration content</div>`;if(page==='Our Beverages')zpFilterProducts();return}zpOriginalRender();if(['National Operations','State Performance','LGA Performance','Hub Performance'].includes(page))document.getElementById('main').insertAdjacentHTML('beforeend',zpHubEdit())};
const zpOriginalNav=nav;
nav=function(){let menu='<div class="navgroup">PUBLIC WEBSITE</div>';for(const p of groups['PUBLIC WEBSITE'])menu+=`<a href="#${ZP_ROUTES[p]}" class="nav ${page===p?'active':''}" ${page===p?'aria-current="page"':''} data-zp-page="${esc(p)}">${esc(p)} <span>›</span></a>`;menu+='<div class="navgroup">OPERATIONS</div>';for(const p of [...groups.OPERATIONS,...ZP_MODULES]){if(p==='Finance & Scenarios'||p==='Profile Settings')continue;if(roleAccess[role]&&groups.OPERATIONS.includes(p)&&!roleAccess[role].includes(p)&&p!=='Administration')continue;menu+=`<button class="nav ${page===p?'active':''}" data-zp-page="${esc(p)}">${esc(p)} <span>›</span></button>`}document.getElementById('sidebar').innerHTML=menu;document.querySelectorAll('[data-zp-page]').forEach(b=>b.addEventListener('click',e=>{if(b.tagName==='A')e.preventDefault();go(b.dataset.zpPage);document.getElementById('sidebar').classList.remove('open')}))};
const zpOriginalGo=go;
go=function(p){page=p;let route=ZP_ROUTES[p];if(route&&location.hash!=='#'+route)history.pushState({page:p},'', '#'+route);render()};
window.addEventListener('popstate',()=>{page=ZP_REVERSE[location.hash.slice(1)]||'Home';render()});window.addEventListener('hashchange',()=>{let p=ZP_REVERSE[location.hash.slice(1)];if(p&&p!==page){page=p;render()}});
if(ZP_REVERSE[location.hash.slice(1)])page=ZP_REVERSE[location.hash.slice(1)];

/* ZARIKS full operations command dashboard. Data are local demonstration records; no live backend. */
const ZD = {section:'all',query:''};
function zdMoney(n){return '₦'+Math.round(n).toLocaleString('en-NG')}
function zdCounts(){const hs=filterHubs(), os=orders.filter(o=>hs.some(h=>h.id===o.hub)), good=os.filter(o=>!o.rejected), qty=good.reduce((s,o)=>s+o.qty,0), delivered=good.filter(o=>o.step>=9).reduce((s,o)=>s+o.qty,0), billed=good.filter(o=>o.step>=10).reduce((s,o)=>s+o.qty*500,0), paid=good.filter(o=>o.step>=11).reduce((s,o)=>s+o.qty*500,0);return {hs,os,good,qty,delivered,billed,paid,capacity:hs.reduce((s,h)=>s+Number(h.capacity||0),0)}}
function zdSelect(v){ZD.section=v;zdRefresh()}
function zdRefresh(){const q=document.getElementById('zdQuery');ZD.query=q?q.value.toLowerCase():'';const area=document.getElementById('zdDetails');if(area)area.innerHTML=zdDetails()}
function zdDetails(){let d=zdCounts(),os=d.os.filter(o=>[o.id,o.school,o.product,o.hub,o.model].join(' ').toLowerCase().includes(ZD.query));let hs=d.hs.filter(h=>[h.id,h.state,h.lga,h.producer].join(' ').toLowerCase().includes(ZD.query));const hubRows=hs.map(h=>[esc(h.id),esc(h.state),esc(h.lga),fmt(h.capacity),status(h.status)]);const orderRows=os.map(o=>[esc(o.id),esc(o.school),fmt(o.qty),esc(o.model),o.rejected?status('Rejected'):esc(steps[Math.min(o.step,steps.length-1)]),`<button class="btn alt" onclick="selected='${o.id}';go('Production Orders')">Open</button>`]);if(ZD.section==='hubs')return `<div class="card"><h2>Production hub register</h2>${table(['Hub','State','LGA','Capacity/day','Verification'],hubRows)}<button class="btn alt" onclick="zpCsv('hubs')">Export hubs CSV</button></div>`;if(ZD.section==='orders')return `<div class="card"><h2>Customer order register</h2>${table(['Order','Buyer','Bottles','Model','Stage','Action'],orderRows)}<button class="btn" onclick="go('Schools & Markets')">Create an order</button></div>`;if(ZD.section==='quality')return `<div class="card"><h2>Quality control queue</h2>${table(['Order','Hub','Status','Action'],os.map(o=>[esc(o.id),esc(o.hub),o.rejected?status('Rejected'):o.step<7?'Release pending':'Workflow stage '+o.step,`<button class="btn alt" onclick="selected='${o.id}';go('Production Orders')">Review</button>`]))}<p class="mini">A browser demonstration cannot verify NAFDAC authorization or issue real quality releases.</p></div>`;if(ZD.section==='finance'){const r=zpFinanceCalc(zpFinancialState);return `<div class="grid">${kpi('Scenario revenue',zdMoney(r.revenue))}${kpi('Variable cost',zdMoney(r.variable))}${kpi('Contribution',zdMoney(r.contribution))}${kpi('Operating result',zdMoney(r.profit))}</div><div class="card"><button class="btn" onclick="go('Financial Management')">Open financial controls</button></div>`}return `<div class="two"><div class="card"><h2>Hub network</h2>${table(['Hub','State','LGA','Capacity/day','Verification'],hubRows)}</div><div class="card"><h2>Order activity</h2>${table(['Order','Buyer','Bottles','Model','Stage','Action'],orderRows)}</div></div>`}
function zdDashboard(){const d=zdCounts();return header('Executive Dashboard','Operations command centre · network, orders, quality and finance',geographyControl())+`<div class="notice"><strong>Local demonstration workspace.</strong> Records and financial scenarios are stored only in the browser session. Facilities have not been independently verified; no live production, payment or regulatory approval is implied.</div><div class="grid zd-metrics">${kpi('Registered hubs',fmt(d.hs.length),'Kano and Jigawa network')}${kpi('Configured capacity/day',fmt(d.capacity),'Planning parameter; not actual output')}${kpi('Customer orders',fmt(d.os.length),'Local workflow records')}${kpi('Bottles ordered',fmt(d.qty),'Excludes rejected orders')}${kpi('Bottles delivered',fmt(d.delivered),'Workflow stage')}${kpi('Invoice value',zdMoney(d.billed),'Demo invoice amounts')}${kpi('Payments recorded',zdMoney(d.paid),'Demo payment steps')}${kpi('Quality holds',fmt(d.os.filter(o=>o.rejected).length),'Rejected batches')}</div><div class="card zd-toolbar"><div class="filters"><label class="field">Workspace<select id="zdSection" onchange="zdSelect(this.value)"><option value="all">All operations</option><option value="hubs">Hub network</option><option value="orders">Orders</option><option value="quality">Quality queue</option><option value="finance">Financial overview</option></select></label><label class="field">Search<input id="zdQuery" type="search" oninput="zdRefresh()" placeholder="Hub, school, product, order"></label><button class="btn" onclick="go('Schools & Markets')">New order</button><button class="btn alt" onclick="go('Financial Management')">Finance</button><button class="btn alt" onclick="go('User Profiles & Settings')">My profile</button></div></div><div id="zdDetails">${zdDetails()}</div><div class="card"><h2>Operations workspace</h2><div class="zd-shortcuts">${['National Operations','State Performance','LGA Performance','Production Hub Management','Producer Management','Farmer and Cooperative Management','School and Institutional Customers','Product Catalog','Production Scheduling','Materials and Procurement','Inventory Management','Quality and Regulatory Compliance','Logistics and Deliveries','Sales & Orders','Financial Management','Contracts and Agreements','Reports & Analytics','User Profiles & Settings'].map(p=>`<button class="btn alt" onclick="go('${p.replace(/'/g,"\\'")}')">${esc(p)}</button>`).join('')}</div></div>`}
const zdPriorOverview=overview;overview=zdDashboard;
const zdPriorRender=render;render=function(){zdPriorRender();if(page==='Executive Dashboard'){const s=document.getElementById('zdSection');if(s)s.value=ZD.section;zdRefresh()} };
// Presentation terminology: keep factual verification status without describing the product as a proposal.
const zdRendered=render;render=function(){zdRendered();const main=document.getElementById('main');if(!main)return;const walk=document.createTreeWalker(main,NodeFilter.SHOW_TEXT);let node;while(node=walk.nextNode()){if(node.parentElement&&['SCRIPT','STYLE','TEXTAREA'].includes(node.parentElement.tagName))continue;node.nodeValue=node.nodeValue.replace(/\billustrative\b/gi,'scenario-based').replace(/\bproposed\b/gi,'unverified').replace(/\bproposals\b/gi,'unverified entries')} };

applyTheme();render();loadGeography();
</script></body></html>
